<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="529px" preserveAspectRatio="none" style="width:1585px;height:529px;background:#FFFFFF;" version="1.1" viewBox="0 0 1585 529" width="1585px" zoomAndPan="magnify"><defs/><g><!--entity client--><g id="elem_client"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="213.9561" x="71.5" y="99"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.3203" x="81.5" y="121.9951">Client_adapter</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.9561" x="81.5" y="138.292">Gateway_ipc_binding_client</text></g><!--entity server--><g id="elem_server"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.8213" x="68.5" y="309"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.7002" x="78.5" y="331.9951">Server_adapter</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.8213" x="78.5" y="348.292">Gateway_ipc_binding_server</text></g><!--entity provider--><g id="elem_provider"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.5283" x="632.5" y="201"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.5283" x="642.5" y="223.9951">Provider_service_binding</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="33.2363" x="642.5" y="240.292">C++</text></g><!--entity consumer--><g id="elem_consumer"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="207.7217" x="626" y="379"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.7217" x="636" y="401.9951">Consumer_service_binding</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="33.2363" x="636" y="418.292">C++</text></g><!--entity sdsvc--><g id="elem_sdsvc"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="197.7002" x="631" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.7002" x="641" y="29.9951">Someipd_service_binding</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="33.2363" x="641" y="46.292">C++</text></g><!--entity runtime--><g id="elem_runtime"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="131.4668" x="1403" y="348"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.4668" x="1413" y="370.9951">SOCom runtime</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="33.2363" x="1413" y="387.292">C++</text></g><!--entity mwcom--><g id="elem_mwcom"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="222.5898" x="1357" y="193"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.4219" x="1367" y="215.9951">mw::com</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.5898" x="1367" y="232.292">Generic for bridged services,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.4189" x="1367" y="248.5889">typed for SomeipdService</text></g><g id="elem_GMN9"><path d="M6,187.5 L6,273.1641 A0,0 0 0 0 6,273.1641 L351.1748,273.1641 A0,0 0 0 0 351.1748,273.1641 L351.1748,197.5 L341.1748,187.5 L182.5,187.5 L178.5,152.11 L174.5,187.5 L6,187.5 A0,0 0 0 0 6,187.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M341.1748,187.5 L341.1748,197.5 L351.1748,197.5 L341.1748,187.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.4683" x="12" y="204.5669">create_client(): sets up all services eagerly</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.6699" x="12" y="219.6997">and consumes SomeipdService.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.1748" x="12" y="234.8325">is_connected() follows the SomeipdService proxy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.5088" x="12" y="249.9653">Owns one Service_binding per configured service</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.6758" x="12" y="265.0981">instance plus one Someipd_service_binding.</text></g><g id="elem_GMN12"><path d="M6.5,397 L6.5,467.5313 A0,0 0 0 0 6.5,467.5313 L350.5513,467.5313 A0,0 0 0 0 350.5513,467.5313 L350.5513,407 L340.5513,397 L182.5,397 L178.5,362.35 L174.5,397 L6.5,397 A0,0 0 0 0 6.5,397 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M340.5513,397 L340.5513,407 L350.5513,407 L340.5513,397 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.9849" x="12.5" y="414.0669">create_server(): setup deferred to start(),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.7095" x="12.5" y="429.1997">which provides SomeipdService first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.0513" x="12.5" y="444.3325">Owns the same set of bindings as Client_adapter,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.1328" x="12.5" y="459.4653">bridged services are symmetric.</text></g><g id="elem_GMN15"><path d="M556,95 L556,165.5313 A0,0 0 0 0 556,165.5313 L904.3931,165.5313 A0,0 0 0 0 904.3931,165.5313 L904.3931,105 L894.3931,95 L734,95 L730,60.35 L726,95 L556,95 A0,0 0 0 0 556,95 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M894.3931,95 L894.3931,105 L904.3931,105 L894.3931,95 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.1602" x="562" y="112.0669">Typed skeleton / proxy, not generic, so it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.9189" x="562" y="127.1997">can carry methods and fields later.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.3892" x="562" y="142.3325">Provided by someipd, consumed by gatewayd.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.3931" x="562" y="157.4653">Replaces the Connect / Connect_reply handshake.</text></g><g id="elem_GMN18"><path d="M564,289 L564,344.3984 A0,0 0 0 0 564,344.3984 L895.7368,344.3984 A0,0 0 0 0 895.7368,344.3984 L895.7368,299 L885.7368,289 L734,289 L730,254.27 L726,289 L564,289 A0,0 0 0 0 564,289 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M885.7368,289 L885.7368,299 L895.7368,299 L885.7368,289 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.7397" x="570" y="306.0669">Owns GenericSkeleton, per-event in-flight</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.7368" x="570" y="321.1997">allocation table and a SOCom Client_connector.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.7754" x="570" y="336.3325">Offers while the local service is available.</text></g><g id="elem_GMN21"><path d="M570,467 L570,522.3984 A0,0 0 0 0 570,522.3984 L889.5684,522.3984 A0,0 0 0 0 889.5684,522.3984 L889.5684,477 L879.5684,467 L734,467 L730,432.27 L726,467 L570,467 A0,0 0 0 0 570,467 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M879.5684,467 L879.5684,477 L889.5684,477 L879.5684,467 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.3687" x="576" y="484.0669">Owns FindServiceHandle, GenericProxy and a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.5684" x="576" y="499.1997">SOCom server connector. Enables it while the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.3022" x="576" y="514.3325">remote instance is found.</text></g><!--link client to provider--><g id="link_client_provider"><path d="M285.63,150.96 C307.37,156.67 330.01,162.98 351,169.5 C364.56,173.71 367.22,177.09 381,180.5 C464.59,201.21 555.9074,212.7975 626.3274,219.5475 " fill="transparent" id="client-to-provider" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="632.3,220.12,623.7227,215.2795,627.3228,219.6429,622.9594,223.243,632.3,220.12" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="35.877" x="436" y="176.5669">Owns</text></g><!--link client to consumer--><g id="link_client_consumer"><path d="M285.89,133.63 C310.11,140.27 333.76,151.33 351,169.5 C397.5,218.5 334.35,269.64 381,318.5 C398.18,336.49 523.5503,364.7148 619.8203,384.2848 " fill="transparent" id="client-to-consumer" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="625.7,385.48,617.6772,379.7673,620.8002,384.484,616.0836,387.607,625.7,385.48" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="35.877" x="436" y="314.5669">Owns</text></g><!--link client to sdsvc--><g id="link_client_sdsvc"><path d="M285.77,107.71 C385.61,90.99 527.8723,67.1704 624.9623,50.9204 " fill="transparent" id="client-to-sdsvc" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="630.88,49.93,621.3432,47.4705,625.9486,50.7554,622.6638,55.3608,630.88,49.93" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.0381" x="382" y="65.5669">Owns (consumer half)</text></g><!--link server to provider--><g id="link_server_provider"><path d="M288.72,314.03 C389.03,294.32 530.3926,266.537 626.5126,247.647 " fill="transparent" id="server-to-provider" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="632.4,246.49,622.7976,244.3006,627.4938,247.4542,624.3403,252.1505,632.4,246.49" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="35.877" x="436" y="265.5669">Owns</text></g><!--link server to consumer--><g id="link_server_consumer"><path d="M288.53,359.76 C309.51,365.46 331.13,372.08 351,379.5 C364.97,384.72 366.55,390.85 381,394.5 C461.43,414.83 549.6548,416.7703 619.7548,413.9603 " fill="transparent" id="server-to-consumer" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="625.75,413.72,616.597,410.0837,620.754,413.9203,616.9174,418.0773,625.75,413.72" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="35.877" x="436" y="390.5669">Owns</text></g><!--link server to sdsvc--><g id="link_server_sdsvc"><path d="M288.69,326.19 C311.83,319.48 334.28,308.69 351,291.5 C392.95,248.37 340,203.53 381,159.5 C426.9,110.22 470.36,153.45 526,115.5 C543.78,103.38 537.95,89.22 556,77.5 C578.23,63.07 599.084,54.8444 624.764,48.3344 " fill="transparent" id="server-to-sdsvc" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="630.58,46.86,620.873,45.1942,625.7333,48.0887,622.8389,52.9489,630.58,46.86" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.1294" x="387" y="111.5669">Owns (provider half)</text></g><!--link provider to runtime--><g id="link_provider_runtime"><path d="M827.93,235.77 C855.05,242.16 882.87,253.06 904,271.5 C930.74,294.83 905.12,324.88 934,345.5 C971.3,372.13 1262.95,374.9349 1396.75,374.8249 " fill="transparent" id="provider-to-runtime" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1402.75,374.82,1393.75,370.82,1397.75,374.82,1393.75,378.82,1402.75,374.82" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.9824" x="1056" y="341.5669">make_client_connector</text></g><!--link consumer to runtime--><g id="link_consumer_runtime"><path d="M834.18,411.83 C953.29,417.62 1154.91,422.81 1327,404.5 C1352.05,401.83 1373.3478,397.9235 1397.0478,392.5635 " fill="transparent" id="consumer-to-runtime" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1402.9,391.24,1393.2393,389.3238,1398.0232,392.3429,1395.0041,397.1268,1402.9,391.24" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.4287" x="1053" y="400.5669">make_server_connector</text></g><!--link provider to mwcom--><g id="link_provider_mwcom"><path d="M827.66,227.5 C964.26,227.5 1207.1,227.5 1350.89,227.5 " fill="transparent" id="provider-to-mwcom" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1356.89