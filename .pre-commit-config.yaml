exclude: '.patch$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.drawio$'
      - id: trailing-whitespace
        # bug in current yamlfmt version, will be fixed via devcontainer update.
        exclude: ^tests/integration/docker_setup/docker-compose.yaml$
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=125, --enforce-all] # increase or add git lfs if too strict
        exclude: MODULE.bazel.lock|tests/benchmarks/benchmarks_analysis.md|score/socom/test/unit/runtime_tests.cpp

  - repo: https://github.com/eclipse-score/tools
    rev: 7694bf823421b5542cd2f45239b8bdf205dbface
    hooks:
      - id: copyright

  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: a1bb792acda6fd0724936b4ebbdbc8eceb9c0459 # v6.2.0
    hooks:
      - id: reuse-lint-file

  - repo: local
    hooks:
      - id: bzlmod-tidy
        name: bazel mod tidy
        entry: bazel mod tidy
        language: system
        pass_filenames: false
      - id: bzlmod-lockfile
        name: bazel mod deps lockfile check
        entry: bazel mod deps --lockfile_mode=error
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        # Hint: running this avoids users having to run inside the devcontainer,
        # while pinning the version of shellcheck to the one in the devcontainer.
        entry: .devcontainer/run-tool shellcheck
        language: system
        types: [shell]
      - id: yamlfmt
        name: yamlfmt
        entry: .devcontainer/run-tool yamlfmt
        language: system
        types: [yaml]
