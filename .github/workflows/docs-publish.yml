name: Publish Documentation

on:
  workflow_run:
    workflows: ["CI", "Cache maintenance"]
    types:
      - completed

jobs:
  docs-deploy:
    # In pull requests both the `CI` and `Cache maintenance` workflows are executed,
    # but only `CI` builds documentation in pull requests.
    # Otherwise on pushes to main, the `Cache maintenance` workflow is executed instead and builds the documentation.
    if: >-
      github.event.workflow_run.conclusion == 'success' && !(
        github.event.workflow_run.name == 'Cache maintenance' &&
        github.event.workflow_run.event == 'pull_request'
      )
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@206a795e30d45de82d541206fde17abe98d2b4bf
    permissions:
      actions: read
      pages: write
      id-token: write
      contents: write
      pull-requests: write
