name: License Check

on:
  workflow_call:

permissions:
  pull-requests: write
  issues: write

jobs:
  license-check:
    uses: eclipse-score/cicd-workflows/.github/workflows/license-check.yml@4c70b38c9cb40c96ec63320190b9db9091648968 # v0.0.3-43-7e8ea4c
    with:
      repo-url: "${{ github.server_url }}/${{ github.repository }}"
      bazel-target: "run //:license-check"
    secrets:
      dash-api-token: ${{ secrets.ECLIPSE_GITLAB_API_TOKEN }}
