# Runs the S-CORE LLVM source-based coverage pipeline.
# See https://github.com/eclipse-score/tooling/tree/main/coverage

name: Coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      # Effective line coverage gate. Raise as coverage improves (default of the
      # tooling is 100, which this repository does not reach yet).
      COVERAGE_THRESHOLD: 0
    steps:
      - uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create Bazel output base directory
        run: |
          sudo mkdir -p /mnt/.bazel
          sudo chown -R $USER:$USER /mnt/.bazel
      - name: Create config indicator file
        run: echo "host" > .bazel_config
      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90 # v0.0.2
        with:
          unique-cache-name: ${{ github.job }}
      - name: Allow linux-sandbox
        uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@212bbf86267e9381da9d2daf962d12f6feafbc90 # v0.0.2
      - run: df -h
      - name: Collect coverage
        run: |
          bazel coverage //... --build_tests_only
      - name: Generate coverage report
        run: |
          COVERAGE_THRESHOLD=67 bazel run @score_tooling//coverage:generate_coverage_html -- --archive-dir coverage_artifacts
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage_artifacts
          if-no-files-found: error
          retention-days: 14
      - run: df -h
        if: always()
