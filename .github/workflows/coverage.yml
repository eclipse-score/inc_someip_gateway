# Runs the S-CORE LLVM source-based coverage pipeline.
# See https://github.com/eclipse-score/tooling/tree/main/coverage

name: Coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    with:
      test-targets: //...
      test-command: coverage
      test-args: --build_tests_only
      coverage-threshold: 85
      cache-key: coverage
      # docs.yml and coverage-publish.yml read the report by this name.
      artifact-name: coverage-report
      retention-days: 14
