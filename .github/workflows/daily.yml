name: Daily Maintenance

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  daily:
    uses: eclipse-score/cicd-workflows/.github/workflows/daily.yml@200f97be787848974e55d1f4ef5615efbaa97ff8 # daily/v0.0.0
    concurrency:
      group: docs-publish
      cancel-in-progress: false
      queue: max
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      pages: write
      pull-requests: write
