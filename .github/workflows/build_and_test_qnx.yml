# Workflow configuration for S-CORE CI - Bazel Build & Test module
# This workflow runs Bazel build and test when triggered by specific pull request events.

name: Build & Test module (cross compilation for QNX)
on:
  workflow_call:
jobs:
  build_and_test_qnx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - bazel-config: "x86_64-qnx"
            bazel-test-target: "//quality/... //tests/integration_test/... //tests/tc8_conformance/..."
          - bazel-config: "aarch64-qnx"
            bazel-test-target: ""
    uses: eclipse-score/cicd-workflows/.github/workflows/qnx-build.yml@200f97be787848974e55d1f4ef5615efbaa97ff8 # 2026-11-18, in sync with other workflows
    permissions:
      contents: read
      pull-requests: read
    with:
      # TODO: build all targets ( //... ) once python toolchain issue is resolved.
      bazel-target: "//score/... //tests/..."
      bazel-test-target: ${{ matrix.bazel-test-target }}
      extra-bazel-test-flags: "--test_tag_filters=-tc8_time_sensitive"
      bazel-config: ${{ matrix.bazel-config }}
      credential-helper: ".github/tools/qnx_credential_helper.py"
      bazel-disk-cache: ${{ github.job }}-${{ matrix.bazel-config }}
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
